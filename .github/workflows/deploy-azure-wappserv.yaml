name: Deploy to Azure Web App Service (Container)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ROCKETSHIP_REGISTRY_SERVER }}
        username: ${{ secrets.ROCKETSHIP_REGISTRY_USERNAME }}
        password: ${{ secrets.ROCKETSHIP_REGISTRY_PASSWORD }}

    # Tag with the git SHA as well as :latest. rocketship.py pins App Service to
    # a SHA tag, so a :latest-only push is never pulled by Azure.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.ROCKETSHIP_REGISTRY_SERVER }}/${{ secrets.ROCKETSHIP_IMAGE }}:latest
          ${{ secrets.ROCKETSHIP_REGISTRY_SERVER }}/${{ secrets.ROCKETSHIP_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Point App Service at the SHA-tagged image so this push is actually deployed.
    # Requires the AZURE_WEBAPP_PUBLISH_PROFILE secret (App Service → Download
    # publish profile); the step is skipped when it is not configured.
    - name: Deploy to Azure App Service
      if: ${{ env.PUBLISH_PROFILE != '' }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: ${{ secrets.ROCKETSHIP_REGISTRY_SERVER }}/${{ secrets.ROCKETSHIP_IMAGE }}:${{ github.sha }}
