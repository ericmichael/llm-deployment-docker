{% extends 'base_generic.html' %}
{% block title %}Sign in · API Portal{% endblock %}

{% block content %}
<div class="mx-auto mt-8 w-full max-w-sm">
  <div class="text-center">
    <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white"><i class="fas fa-key"></i></span>
    <h1 class="mt-4 text-2xl font-semibold text-gray-900">Sign in</h1>
    <p class="mt-1 text-sm text-gray-600">Use your university account.</p>
  </div>

  <div class="mt-8 rounded-xl bg-white p-6 shadow-sm ring-1 ring-gray-900/5">
    {% if form.non_field_errors %}
    <div class="mb-4 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors.0 }}</div>
    {% endif %}
    <form class="space-y-5" method="POST">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700">Email address</label>
        <div class="mt-1">{{ form.username }}</div>
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="mt-1">{{ form.password }}</div>
      </div>
      <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
