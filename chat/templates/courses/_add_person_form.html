<form method="post" action="{{ action_url }}" class="mt-4 flex items-end gap-3 border-t border-gray-100 pt-4">
  {% csrf_token %}
  <div class="flex-1">
    <label for="id_email" class="mb-1 block text-xs font-medium text-gray-500">Add a {{ button_label }} by email</label>
    {{ form.email }}
  </div>
  <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700">Add</button>
</form>
