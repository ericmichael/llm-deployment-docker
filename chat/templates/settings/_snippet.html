<div data-controller="clipboard" class="relative">
  <textarea data-clipboard-target="source" class="sr-only" readonly aria-hidden="true">{{ code }}</textarea>
  <button type="button" data-action="clipboard#copy" data-clipboard-target="button"
          class="absolute right-2 top-2 rounded-md bg-gray-800 px-2 py-1 text-xs font-medium text-gray-200 hover:bg-gray-700"><i class="fas fa-copy mr-1"></i>Copy</button>
  <pre class="overflow-x-auto rounded-lg bg-gray-900 p-4 text-xs leading-relaxed text-gray-100"><code>{{ code }}</code></pre>
</div>
