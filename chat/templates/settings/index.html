<!-- templates/settings/index.html -->
{% extends 'base_generic.html' %}

{% block content %}
<div class="flex flex-col">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-gray-900">Developer Settings</h1>
  </div>

  <div class="grid grid-cols-1 gap-x-8 gap-y-8 md:grid-cols-2">
    <div>
      <h2 class="text-base font-semibold leading-7 text-gray-900">API Settings</h2>
      <p class="mt-1 text-sm leading-6 text-gray-600">
        Use these credentials with the OpenAI SDK. Set <code class="bg-gray-100 px-1 rounded">base_url</code> to the API Base below.
      </p>
      <p class="mt-3 text-sm leading-6 text-gray-600">
        Do not share your API key with others, or expose it in code.
      </p>
    </div>

    <div class="bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-xl">
      <div class="px-4 py-6 sm:p-8">
        <div class="grid grid-cols-1 gap-y-6">
          <div>
            <label for="api_base" class="block text-sm font-medium leading-6 text-gray-900">API Base</label>
            <div class="mt-2">
              <input id="api_base" readonly value="{{ api_base }}" name="api_base" type="text"
                class="px-3 block w-full rounded-md border-0 py-1.5 text-gray-900 bg-gray-50 shadow-sm ring-1 ring-inset ring-gray-300 sm:text-sm sm:leading-6">
            </div>
          </div>

          <div>
            <label for="api_key" class="block text-sm font-medium leading-6 text-gray-900">API Key</label>
            <div class="mt-2">
              <input id="api_key" readonly value="{{ api_key }}" name="api_key" type="text"
                class="px-3 block w-full rounded-md border-0 py-1.5 text-gray-900 bg-gray-50 shadow-sm ring-1 ring-inset ring-gray-300 font-mono sm:text-sm sm:leading-6">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
