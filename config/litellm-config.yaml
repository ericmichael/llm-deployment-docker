litellm_settings:
  drop_params: true
  telemetry: false
router:
  model_list:
    - model_name: gpt-5
      litellm_params:
        model: azure/gpt-5
        api_base: os.environ/AZURE_OPENAI_ENDPOINT
        api_version: os.environ/OPENAI_API_VERSION
        api_key: os.environ/AZURE_OPENAI_API_KEY
        temperature: 1
