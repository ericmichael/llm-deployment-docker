general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  # Timezone for budget resets: with budget_duration "1mo" every key's spend
  # resets on the 1st of the month at midnight in this zone.
  timezone: America/Chicago
  drop_params: true
  telemetry: false
  num_retries: 3
  request_timeout: 900
model_list:
  - model_name: gpt-5
    litellm_params:
      model: azure/gpt-5
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-5.1
    litellm_params:
      model: azure/gpt-5.1
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-5.2
    litellm_params:
      model: azure/gpt-5.2
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-4.1
    litellm_params:
      model: azure/gpt-4.1
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-4o
    litellm_params:
      model: azure/gpt-4o
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-4o-mini
    litellm_params:
      model: azure/gpt-4o-mini
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      temperature: 1
  - model_name: gpt-realtime
    litellm_params:
      model: azure/gpt-realtime
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/OPENAI_API_VERSION
      api_key: os.environ/AZURE_OPENAI_API_KEY
      realtime_protocol: "GA"
    model_info:
      # "azure/gpt-realtime" has no entry in LiteLLM's price map, so without
      # this spend logs as $0 and bypasses student budgets.
      base_model: azure/gpt-realtime-2025-08-28
