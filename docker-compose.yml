services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aistarterkit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django application service
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18000:8000"  # Django + WebSocket (host:container)
    volumes:
      # Mount source code for live reload
      - .:/usr/src/app
      # Persist node_modules (avoid overwriting with local)
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      # PostgreSQL connection (for Django)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aistarterkit
      # Development settings
      ENVIRONMENT: development
    stdin_open: true
    tty: true

volumes:
  postgres_data:
